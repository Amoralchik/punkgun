<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <title>PUNKGUN — OFFLINE</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #10202c, #05070c 65%);
        color: #dffcff;
        font-family: Bahnschrift, "DIN Alternate", ui-monospace, monospace;
        text-align: center;
      }
      .panel {
        width: min(560px, calc(100% - 48px));
        padding: 40px 34px;
        border: 1px solid rgba(98, 246, 255, 0.35);
        box-shadow: 0 0 40px rgba(255, 47, 142, 0.12);
      }
      .kicker { color: #ff2f8e; font-size: 10px; letter-spacing: 0.2em; }
      h1 { margin: 14px 0; font-size: clamp(44px, 9vw, 80px); letter-spacing: 0.06em; }
      p { color: rgba(223, 252, 255, 0.62); font-size: 12px; line-height: 1.7; letter-spacing: 0.08em; }
      button {
        margin-top: 20px;
        padding: 12px 18px;
        border: 1px solid #62f6ff;
        background: transparent;
        color: #62f6ff;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.16em;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="kicker">// CONNECTION LOST</div>
      <h1>OFFLINE</h1>
      <p>The terminal cannot reach the city network. The last cached build is still available through the app shell.</p>
      <button onclick="location.reload()">RETRY CONNECTION</button>
    </main>
  </body>
</html>
